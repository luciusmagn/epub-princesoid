<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Princeznoid Proof</title>
    <!-- Lucide icons; license: /vendor/lucide-LICENSE -->
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">P</span>
          <div>
            <h1>Princeznoid</h1>
            <p id="file-label">No document open</p>
          </div>
        </div>
        <div class="toolbar">
          <button id="open-button" class="primary">Open</button>
          <button id="prev-button" disabled>Prev</button>
          <button id="next-button" disabled>Next</button>
          <button id="reload-button" disabled>Reload</button>
          <div id="pdf-controls" class="pdf-only">
            <label class="pdf-page-control">Page <input id="pdf-page-input" type="number" min="1" value="1" aria-label="PDF page" /><span id="pdf-page-total">/ 0</span></label>
            <select id="pdf-language" title="Proofing language" aria-label="Proofing language">
              <option value="auto">Auto language</option>
              <option value="en">English</option>
              <option value="cs">Czech</option>
              <option value="es">Spanish</option>
              <option value="de">German</option>
            </select>
            <button id="pdf-run-checks" title="Run checks again">Check</button>
          </div>
          <div id="epub-controls">
          <select id="reader-preset" title="Reader preset">
            <option value="fluid">Fluid</option>
            <option value="kindle-paperwhite">Kindle Paperwhite</option>
            <option value="kindle-oasis">Kindle Oasis</option>
            <option value="kobo-clara">Kobo Clara</option>
            <option value="kobo-libra">Kobo Libra</option>
            <option value="apple-books-phone">Apple Books Phone</option>
            <option value="apple-books-ipad">Apple Books iPad</option>
            <option value="boox-palma">BOOX Palma</option>
            <option value="boox-go-6">BOOX Go 6</option>
            <option value="boox-go-7">BOOX Go/Color 7</option>
            <option value="boox-go-103">BOOX Go 10.3</option>
            <option value="boox-note-air">BOOX Note Air</option>
          </select>
          <label>
            Type
            <input id="font-size" type="range" min="80" max="170" step="5" value="100" />
          </label>
          <label class="range-control">
            Margin
            <input id="page-margin" type="range" min="0" max="96" step="2" value="36" />
            <output id="page-margin-value">36px</output>
          </label>
          <select id="spread-mode" title="Spread mode">
            <option value="none">Single</option>
            <option value="auto">Auto</option>
            <option value="always">Spread</option>
          </select>
          </div>
          <select id="theme-mode" title="Theme">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </div>
      </header>

      <aside class="sidebar">
        <section>
          <h2>File</h2>
          <dl>
            <div>
              <dt>Name</dt>
              <dd id="file-name">-</dd>
            </div>
            <div>
              <dt>Size</dt>
              <dd id="file-size">-</dd>
            </div>
            <div>
              <dt>Status</dt>
              <dd id="reload-state">Waiting</dd>
            </div>
          </dl>
        </section>
        <section class="epub-only">
          <div class="section-row">
            <h2>Progress</h2>
            <span id="progress-text">0%</span>
          </div>
          <div class="progress-track"><div id="progress-bar"></div></div>
        </section>
        <section class="toc-section epub-only">
          <h2>Contents</h2>
          <nav id="toc-list"><p class="muted">Open an EPUB.</p></nav>
        </section>
        <section id="pdf-findings" class="pdf-only">
          <div class="section-row">
            <h2>Findings</h2>
            <div id="pdf-issue-nav">
              <button id="pdf-words-open" type="button" title="Allowed words">Words</button>
              <span id="pdf-count">0</span>
              <button id="pdf-prev-issue" type="button" title="Previous finding" aria-label="Previous finding" disabled>↑</button>
              <button id="pdf-next-issue" type="button" title="Next finding" aria-label="Next finding" disabled>↓</button>
            </div>
          </div>
          <div class="pdf-review-actions">
            <button id="pdf-undo" type="button" title="Undo last review action" disabled>
              <svg class="lucide" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11" /></svg>
              Undo
            </button>
          </div>
          <p id="pdf-scan-status" class="muted">Open a PDF.</p>
          <select id="pdf-filter" aria-label="Filter findings">
            <option value="all">All checks</option>
            <option value="coverage">Text coverage</option>
            <option value="image">Image resolution</option>
            <option value="toc">Contents</option>
            <option value="hyphenation">Word breaks</option>
            <option value="dash">Dashes</option>
            <option value="quote">Quotation marks</option>
            <option value="spacing">Double spaces</option>
            <option value="spelling">Spelling</option>
            <option value="language">Language</option>
            <option value="widow">Widows / orphans</option>
          </select>
          <div id="pdf-issue-list" role="list"></div>
        </section>
      </aside>

      <main class="reader-shell">
        <div id="drop-layer">Drop PDF or EPUB</div>
        <div id="empty-state">
          <div>
            <div class="empty-mark">P</div>
            <h2>Open a PDF or EPUB</h2>
            <button id="empty-open-button" class="primary">Open file</button>
          </div>
        </div>
        <div id="viewer"></div>
        <div id="pdf-view-toolbar" class="pdf-only" role="group" aria-label="PDF zoom">
          <button id="pdf-zoom-out" type="button" title="Zoom out" aria-label="Zoom out">
            <svg class="lucide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8" /><line x1="21" x2="16.65" y1="21" y2="16.65" /><line x1="8" x2="14" y1="11" y2="11" /></svg>
          </button>
          <select id="pdf-zoom" title="Page zoom" aria-label="Page zoom">
            <option value="page">Fit page</option>
            <option value="width">Fit width</option>
            <option value="0.5">50%</option>
            <option value="0.75">75%</option>
            <option value="1">100%</option>
            <option value="1.25">125%</option>
            <option value="1.5">150%</option>
            <option value="2">200%</option>
            <option value="3">300%</option>
            <option id="pdf-zoom-custom" value="custom" disabled hidden></option>
          </select>
          <button id="pdf-zoom-in" type="button" title="Zoom in" aria-label="Zoom in">
            <svg class="lucide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8" /><line x1="21" x2="16.65" y1="21" y2="16.65" /><line x1="11" x2="11" y1="8" y2="14" /><line x1="8" x2="14" y1="11" y2="11" /></svg>
          </button>
        </div>
        <div id="pdf-page-shell" class="pdf-only" tabindex="0">
          <div id="pdf-stage">
            <img id="pdf-page-image" alt="PDF page" />
            <div id="pdf-overlays"></div>
          </div>
          <div id="pdf-page-caption"></div>
        </div>
      </main>

      <div id="toast" role="status" aria-live="polite"></div>
    </div>
    <dialog id="pdf-words-dialog" aria-labelledby="pdf-words-title">
      <div id="pdf-words-header">
        <h2 id="pdf-words-title">Allowed words</h2>
        <span id="pdf-word-count">0</span>
        <button id="pdf-words-undo" type="button" title="Undo last review action" aria-label="Undo last review action" disabled>
          <svg class="lucide" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11" /></svg>
        </button>
        <button id="pdf-words-close" type="button" title="Close" aria-label="Close">×</button>
      </div>
      <form id="pdf-word-form">
        <input id="pdf-word-input" type="text" placeholder="Add word" aria-label="Word to allow" autocomplete="off" spellcheck="false" />
        <button type="submit" title="Add allowed word" aria-label="Add allowed word">+</button>
      </form>
      <input id="pdf-word-search" type="search" placeholder="Search words" aria-label="Search allowed words" autocomplete="off" />
      <div id="pdf-word-list" role="list"></div>
    </dialog>
    <script src="/vendor/jszip.min.js"></script>
    <script src="/vendor/epub.min.js"></script>
    <script src="/app.js"></script>
    <script src="/pdf-ui.js"></script>
  </body>
</html>
